# Déploiement sur Render (« Blueprint ») : le site et sa base PostgreSQL.
# Render lit ce fichier quand on crée le Blueprint depuis le dépôt GitHub.
# Documentation : https://render.com/docs/blueprint-spec

databases:
  - name: synthetiseur-de-reves-db
    plan: free
    # Francfort : les données restent dans l'Union européenne (RGPD).
    region: frankfurt
    databaseName: dreams
    user: dreams
    postgresMajorVersion: "17"

services:
  - type: web
    name: synthetiseur-de-reves
    runtime: python
    plan: free
    region: frankfurt
    # Déploiement automatique à chaque fusion sur main, seulement si la CI
    # (ruff + tests) est verte.
    branch: main
    autoDeployTrigger: checksPass
    # Construction : installe les dépendances et rassemble le CSS, le JS et
    # les images pour WhiteNoise.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Démarrage : applique les migrations, puis lance Gunicorn (serveur de
    # production). Le délai de 180 s couvre la génération d'image, qui peut
    # prendre plus d'une minute si Replicate doit réessayer.
    # --keep-alive 5 : sans lui, le test de charge montrait de rares connexions
    # coupées (docs/test-de-charge.md).
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 180 --keep-alive 5
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.16"
      - key: DEBUG
        value: "False"
      # Clé secrète de Django : générée par Render, jamais écrite dans le code.
      - key: SECRET_KEY
        generateValue: true
      # Adresse de la base, fournie par Render.
      - key: DATABASE_URL
        fromDatabase:
          name: synthetiseur-de-reves-db
          property: connectionString
      # Clés d'API : « sync: false » = Render les demande à la création du
      # Blueprint. Elles ne sont jamais écrites dans ce fichier ni sur GitHub.
      - key: GROQ_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
