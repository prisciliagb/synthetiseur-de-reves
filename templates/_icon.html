{# Icônes SVG au trait, dans la couleur du texte (currentColor). #}
{# Utilisation : {% include "_icon.html" with name="home" size=20 %} #}
<svg class="dv-icon" width="{{ size|default:20 }}" height="{{ size|default:20 }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == "home" %}
    <path d="M3.5 10.5 12 3.5l8.5 7V20a.8.8 0 0 1-.8.8H15v-6H9v6H4.3a.8.8 0 0 1-.8-.8z"/>
  {% elif name == "mic" %}
    <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
  {% elif name == "book" %}
    <path d="M12 6.5C10.4 5 8 4.5 4 4.5v14c4 0 6.4.5 8 2 1.6-1.5 4-2 8-2v-14c-4 0-6.4.5-8 2zM12 6.5v14"/>
  {% elif name == "chart" %}
    <path d="M5 20v-7M12 20V5M19 20v-10"/>
  {% elif name == "logout" %}
    <path d="M10 4H5.5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1H10M15 8l4 4-4 4M19 12H9"/>
  {% elif name == "login" %}
    <path d="M14 4h4.5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H14M9 8l4 4-4 4M13 12H3"/>
  {% elif name == "arrow" %}
    <path d="M5 12h14M13 6l6 6-6 6"/>
  {% elif name == "wand" %}
    <path d="M4 20 14 10M12.5 8.5l3 3M17 3v3M15.5 4.5h3M20 9v2M19 10h2M9 4v2M8 5h2"/>
  {% elif name == "image" %}
    <rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.7"/><path d="M21 16l-5-5-9 9"/>
  {% endif %}
</svg>
